name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'appcast.xml'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]

# Declared in-repo rather than inherited from repo settings: this workflow only
# needs to read the checkout. Job-level blocks may narrow it further.
permissions:
  contents: read

env:
  SCHEME: Meridian
  PROJECT: Meridian/Meridian.xcodeproj
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
  NSUnbufferedIO: "YES"

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: macos-26
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # Cache key includes Swift sources so a code change invalidates
          # the cached module artifacts (otherwise xcodebuild reuses
          # stale .swiftmodule files compiled against an older API
          # surface and the build fails with cryptic "(24 failures)"
          # errors that don't appear locally).
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Meridian/Meridian.xcodeproj/project.pbxproj', 'Meridian/CoreLoggerKit/Package.swift', 'Meridian/CoreModelKit/Package.swift', 'Meridian/**/*.swift') }}
          # Intentionally no restore-keys: a partial-match fallback
          # would pull in DerivedData built against a different Swift
          # API surface and the build would fail with stale-module
          # errors. Cache miss on source change → clean build, which
          # is the only safe state.

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint

      - name: Build & Analyze
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            build analyze \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            | xcpretty

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    needs: build-and-lint
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # Match build job's cache key so the Build & Lint output
          # carries forward into Unit Tests rather than rebuilding from
          # scratch on a partial-match fallback.
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Meridian/Meridian.xcodeproj/project.pbxproj', 'Meridian/CoreLoggerKit/Package.swift', 'Meridian/CoreModelKit/Package.swift', 'Meridian/**/*.swift') }}
          # Intentionally no restore-keys: a partial-match fallback
          # would pull in DerivedData built against a different Swift
          # API surface and the build would fail with stale-module
          # errors. Cache miss on source change → clean build, which
          # is the only safe state.

      - name: Run Unit Tests
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            test \
            -only-testing:MeridianUnitTests \
            -disable-concurrent-destination-testing \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            -resultBundlePath TestResults/unit-tests.xcresult \
            | xcpretty

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: TestResults/

  sonar:
    name: SonarQube
    runs-on: macos-26
    needs: unit-tests
    # Fork PRs cannot read secrets, so the scan would fail on an empty token.
    # Skip rather than fail red on contributions from outside the repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scanner uses it to attribute issues to authors and
          # to work out what is "new code". A shallow clone degrades both.
          fetch-depth: 0

      - name: Download Test Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-test-results
          path: TestResults

      # SonarQube cannot read .xcresult. Convert it, and only hand the report to
      # the scanner if the conversion produced real data -- a missing coverage
      # metric is honest, a 0% one is a lie.
      - name: Convert Coverage
        id: coverage
        run: |
          if python3 scripts/xccov_to_sonar.py \
               TestResults/unit-tests.xcresult --root . > coverage.xml; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Coverage conversion produced nothing; scanning without coverage."
            rm -f coverage.xml
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # sonar-project.properties sets coverageReportPaths unconditionally;
          # blank it out when there is no report so the scanner does not warn.
          args: >
            ${{ steps.coverage.outputs.found == 'false' && '-Dsonar.coverageReportPaths=' || '' }}
