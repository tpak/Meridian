# SonarQube Cloud — CI-based analysis configuration
#
# Read by the sonar job in .github/workflows/ci.yml, which runs the scanner on
# every push to main and every pull request. This replaces Automatic Analysis,
# which fired on 2 of 11 pushes and could only be kicked off by hand from the
# web UI (see the SonarQube Cloud section of CLAUDE.md).
#
# Automatic Analysis must be disabled by hand for this to run at all: with both
# enabled the scanner exits 3 with "You are running CI analysis while Automatic
# Analysis is enabled". The toggle is under Administration -> Analysis Method.
#
# Unlike .sonarcloud.properties — which Automatic Analysis read for exclusions
# only — the scanner reads *all* of the properties below, including the issue
# suppressions that were inert under Automatic Analysis.

sonar.projectKey=tpak_Meridian
sonar.organization=tpak
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
#
# Only Meridian/ and scripts/ are analysed. design_handoff_meridian_v4/ sits at
# the repo root and is therefore out of scope without needing an exclusion: it
# is a design-partner handoff (static .dc.html artboards plus the Claude Design
# canvas runtime), none of it compiled into or shipped with the app.
sonar.sources=Meridian,scripts
sonar.tests=Meridian/MeridianUnitTests,Meridian/MeridianUITests

# The test targets live under Meridian/, so they must be excluded from sources
# or the scanner indexes them twice.
sonar.exclusions=Meridian/MeridianUnitTests/**,Meridian/MeridianUITests/**

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
#
# scripts/xccov_to_sonar.py converts the .xcresult bundle the unit-tests job
# already produces into SonarQube's generic coverage XML. The workflow only
# passes this path when the conversion actually produced data, so a failed
# conversion drops coverage rather than reporting a misleading 0%.
sonar.coverageReportPaths=coverage.xml

# Build tooling is not unit-tested and never will be, so counting it against
# new-code coverage would fail the quality gate on any PR that touches a script.
# Issues in these files are still reported — only coverage is exempt.
sonar.coverage.exclusions=scripts/**

# ---------------------------------------------------------------------------
# Issue suppressions
# ---------------------------------------------------------------------------
#
# Each entry is a rule that is wrong for Swift/Cocoa idiom or for this codebase
# specifically. Scoped as narrowly as the multicriteria mechanism allows (rule +
# path). The [n] is how many issues each cleared at revision 82df73ba, the last
# Automatic Analysis scan; together they account for all 90 open issues.

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10

# e1 — swift:S100 (function naming ^[a-z][a-zA-Z0-9]*$) in the test targets. [62]
# XCTest convention is testSubject_condition, e.g. testParity_sunrise or
# testInvertedBool_legacyZeroBecomesTrue. The underscore is deliberate and
# standard. Meridian*Tests matches both MeridianUnitTests and MeridianUITests.
sonar.issue.ignore.multicriteria.e1.resourceKey=Meridian/Meridian*Tests/**/*
sonar.issue.ignore.multicriteria.e1.ruleKey=swift:S100

# e2 — swift:S115 (constant naming) in the test targets. Same convention
# argument as e1, e.g. CLUITestingLaunchArgument in PanelTests. [1]
sonar.issue.ignore.multicriteria.e2.resourceKey=Meridian/Meridian*Tests/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=swift:S115

# e3 — swift:S3661 (force `try!`) in the test targets. A throw in a test IS the
# failure signal. SwiftLint already enforces this rule as an *error* for app
# code while excluding test directories; this aligns Sonar with that. [5]
sonar.issue.ignore.multicriteria.e3.resourceKey=Meridian/Meridian*Tests/**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=swift:S3661

# e4 — swift:S100 on the AppKit accent swizzler. The mer_ prefix is a
# deliberate ObjC namespace guard on swizzled methods, not sloppy naming. [2]
sonar.issue.ignore.multicriteria.e4.resourceKey=Meridian/App/AccentColorSwizzler.swift
sonar.issue.ignore.multicriteria.e4.ruleKey=swift:S100

# e5 — swift:S1186 ("empty function/closure") across the Daybreak panel and
# GlobalShortcutMonitor. Every hit is a no-op closure default or a private
# singleton init: `var onOpenSettings: () -> Void = {}`,
# `var setOffset: (Int) -> Void = { _ in }`, `private init() {}`.
# Idiomatic Swift, not an incomplete implementation. [6]
sonar.issue.ignore.multicriteria.e5.resourceKey=Meridian/**/*.swift
sonar.issue.ignore.multicriteria.e5.ruleKey=swift:S1186

# e6 — swift:S1172 (unused parameter) on AppKit delegate conformances:
# windowDidMove(_ notification:), makeNSView(context:), mouseDown(with event:).
# The signature is fixed by the protocol; renaming to `_` costs readability
# and greppability for no benefit. [7]
sonar.issue.ignore.multicriteria.e6.resourceKey=Meridian/Panel/**/*.swift
sonar.issue.ignore.multicriteria.e6.ruleKey=swift:S1172

# e7 — swift:S1172 on ShortcutRecorderButton.mouseDown(with event:). Exactly the
# e6 argument, but the file sits in Preferences/General/ rather than Panel/. [1]
sonar.issue.ignore.multicriteria.e7.resourceKey=Meridian/Preferences/General/**/*.swift
sonar.issue.ignore.multicriteria.e7.ruleKey=swift:S1172

# e8 — swift:S1075 ("hard-coded URI"). Three hits are canonical project URLs in
# AboutUsConstants (github.com/tpak/Meridian and the GitHub Pages manual) which
# by definition are not configurable. The fourth flags the "/" in an IANA
# timezone identifier (America/New_York) in CitySearchService as a filesystem
# path delimiter. [4]
sonar.issue.ignore.multicriteria.e8.resourceKey=Meridian/Preferences/V4Settings/**/*.swift
sonar.issue.ignore.multicriteria.e8.ruleKey=swift:S1075

# e9 — swift:S2961 (backtick-escaped identifier) on
# `static let \`default\`: TeamAccent`. Reads as TeamAccent.default at call
# sites, matching NotificationCenter.default / UserDefaults.standard. The
# backtick is the price of the right call-site name. [1]
sonar.issue.ignore.multicriteria.e9.resourceKey=Meridian/Overall App/DataStore.swift
sonar.issue.ignore.multicriteria.e9.ruleKey=swift:S2961

# e10 — swift:S7694 ("Package.resolved missing"). CoreModelKit's only dependency
# is .package(path: "../CoreLoggerKit/") — a local path package with no version
# to pin. The workspace Package.resolved lives under
# Meridian.xcodeproj/project.xcworkspace/xcshareddata/ per the Xcode layout.
# This is the project's sole remaining "vulnerability". [1]
sonar.issue.ignore.multicriteria.e10.resourceKey=Meridian/CoreModelKit/Package.swift
sonar.issue.ignore.multicriteria.e10.ruleKey=swift:S7694
