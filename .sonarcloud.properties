# SonarQube Cloud — Automatic Analysis configuration
#
# Versioned in the repo so the configuration survives independently of the
# SonarQube Cloud UI settings. Automatic Analysis reads this file from the
# repository root on every scan; there is no CI step to keep in sync.
#
# Project: tpak_Meridian (org: tpak)
#
# ---------------------------------------------------------------------------
# IMPORTANT: Automatic Analysis honours only part of this file
# ---------------------------------------------------------------------------
#
# Measured against revision 82df73ba (2026-08-23) — the first scan that
# actually ran with this file in place:
#
#   sonar.exclusions       HONOURED. design_handoff_meridian_v4/ left the scan
#                          entirely: lines of code 14,844 -> 12,799, issues
#                          249 -> 90, bugs 22 -> 0, vulnerabilities 6 -> 1,
#                          Reliability C -> A, Security D -> C.
#
#   sonar.issue.ignore.*   IGNORED. All ten entries were still firing after the
#                          scan. The e1 comment predicted "62 issues came from
#                          this alone" and the scan reported exactly 62 — the
#                          reasoning was right, the mechanism does nothing here.
#
# Issue suppression is a server-side setting. To make the entries below take
# effect, enter them by hand in the web UI:
#
#   Project -> Administration -> General Settings -> Analysis Scope
#     -> Issues -> "Ignore Issues on Multiple Criteria"
#
# one row per entry, using the Rule Key and File Path pattern given with each.
# Doing so takes the project from 90 open issues to 0 and Security from C to A.
#
# The properties are kept here, commented out, because a CI-based scanner DOES
# honour them. If this project ever moves off Automatic Analysis, delete the UI
# rows and uncomment this block rather than re-deriving the arguments.

# ---------------------------------------------------------------------------
# Exclusions — honoured
# ---------------------------------------------------------------------------

# design_handoff_meridian_v4/ is a design-partner handoff artifact: static
# .dc.html artboards plus the Claude Design canvas runtime (support.js).
# None of it is compiled into or shipped with the app, and support.js is
# bundled third-party code we do not maintain. Scanning it contributed
# ~126 of 249 issues, including 5 of the 6 reported vulnerabilities.
sonar.exclusions=design_handoff_meridian_v4/**

# ---------------------------------------------------------------------------
# Issue suppressions — NOT honoured here; enter them in the UI
# ---------------------------------------------------------------------------
#
# Each entry documents a rule that is either wrong for Swift/Cocoa idiom or
# wrong for this codebase specifically. Scoped as narrowly as the multicriteria
# mechanism allows (rule + path), so a suppression never reaches further than
# the pattern it is arguing about. The [n] on each heading is how many issues
# that entry clears, measured at revision 82df73ba.

# sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11

# e1/e2 — swift:S100 (function naming ^[a-z][a-zA-Z0-9]*$) in test targets. [62]
# XCTest convention is testSubject_condition, e.g. testParity_sunrise or
# testInvertedBool_legacyZeroBecomesTrue. The underscore is deliberate and
# standard; 62 issues come from this alone.
# sonar.issue.ignore.multicriteria.e1.resourceKey=Meridian/MeridianUnitTests/**/*
# sonar.issue.ignore.multicriteria.e1.ruleKey=swift:S100
# sonar.issue.ignore.multicriteria.e2.resourceKey=Meridian/MeridianUITests/**/*
# sonar.issue.ignore.multicriteria.e2.ruleKey=swift:S100

# e3 — swift:S115 (constant naming) in test targets. Same convention argument
# as e1/e2, e.g. CLUITestingLaunchArgument in PanelTests. [1]
# sonar.issue.ignore.multicriteria.e3.resourceKey=Meridian/Meridian*Tests/**/*
# sonar.issue.ignore.multicriteria.e3.ruleKey=swift:S115

# e4 — swift:S3661 (force `try!`) in test targets. A throw in a test IS the
# failure signal. SwiftLint already enforces this rule as an *error* for
# app code while excluding test directories; this aligns Sonar with that. [5]
# sonar.issue.ignore.multicriteria.e4.resourceKey=Meridian/Meridian*Tests/**/*
# sonar.issue.ignore.multicriteria.e4.ruleKey=swift:S3661

# e5 — swift:S100 on the AppKit accent swizzler. The mer_ prefix is a
# deliberate ObjC namespace guard on swizzled methods, not sloppy naming. [2]
# sonar.issue.ignore.multicriteria.e5.resourceKey=Meridian/App/AccentColorSwizzler.swift
# sonar.issue.ignore.multicriteria.e5.ruleKey=swift:S100

# e6 — swift:S1186 ("empty function/closure") across the Daybreak panel and
# GlobalShortcutMonitor. Every hit is a no-op closure default or a private
# singleton init: `var onOpenSettings: () -> Void = {}`,
# `var setOffset: (Int) -> Void = { _ in }`, `private init() {}`.
# Idiomatic Swift, not an incomplete implementation. [6]
# sonar.issue.ignore.multicriteria.e6.resourceKey=Meridian/**/*.swift
# sonar.issue.ignore.multicriteria.e6.ruleKey=swift:S1186

# e7 — swift:S1172 (unused parameter) on AppKit delegate conformances:
# windowDidMove(_ notification:), makeNSView(context:), mouseDown(with event:).
# The signature is fixed by the protocol; renaming to `_` costs readability
# and greppability for no benefit. [7]
# sonar.issue.ignore.multicriteria.e7.resourceKey=Meridian/Panel/**/*.swift
# sonar.issue.ignore.multicriteria.e7.ruleKey=swift:S1172

# e8 — swift:S1075 ("hard-coded URI"). Three hits are canonical project URLs
# in AboutUsConstants (github.com/tpak/Meridian and the GitHub Pages manual)
# which by definition are not configurable. The fourth flags the "/" in an
# IANA timezone identifier (America/New_York) in CitySearchService as a
# filesystem path delimiter. [4]
# sonar.issue.ignore.multicriteria.e8.resourceKey=Meridian/Preferences/V4Settings/**/*.swift
# sonar.issue.ignore.multicriteria.e8.ruleKey=swift:S1075

# e9 — swift:S2961 (backtick-escaped identifier) on
# `static let \`default\`: TeamAccent`. Reads as TeamAccent.default at call
# sites, matching NotificationCenter.default / UserDefaults.standard. The
# backtick is the price of the right call-site name. [1]
# sonar.issue.ignore.multicriteria.e9.resourceKey=Meridian/Overall App/DataStore.swift
# sonar.issue.ignore.multicriteria.e9.ruleKey=swift:S2961

# e10 — swift:S7694 ("Package.resolved missing"). CoreModelKit's only
# dependency is .package(path: "../CoreLoggerKit/") — a local path package
# with no version to pin. The workspace Package.resolved lives under
# Meridian.xcodeproj/project.xcworkspace/xcshareddata/ per the Xcode layout.
# This is the project's sole remaining "vulnerability" and the only thing
# holding Security at C rather than A. [1]
# sonar.issue.ignore.multicriteria.e10.resourceKey=Meridian/CoreModelKit/Package.swift
# sonar.issue.ignore.multicriteria.e10.ruleKey=swift:S7694

# e11 — swift:S1172 on ShortcutRecorderButton.mouseDown(with event:). Exactly
# the e7 argument, but the file sits in Preferences/General/ rather than
# Panel/, so e7's path pattern misses it. Not part of the original set; it is
# the one issue that e1-e10 leave behind. [1]
# sonar.issue.ignore.multicriteria.e11.resourceKey=Meridian/Preferences/General/**/*.swift
# sonar.issue.ignore.multicriteria.e11.ruleKey=swift:S1172
